server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 2048
  shutdown: graceful

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration
  application:
    name: platform-monolith
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowledge_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    vertex:
      ai:
        gemini:
          api-key: ${GEMINI_API_KEY}
    openai:
      api-key: ${GEMINI_API_KEY:mock-key}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

platform:
  jwt:
    secret: "enterprise-secure-jwt-secret-key-123456789-abc"
    expiration-seconds: 3600
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ""
    database: 0
    connection-timeout-ms: 2000
  mail:
    host: "localhost"
    port: 25
    username: ""
    password: ""
    from-address: "noreply@enterprise.com"
    connection-timeout-ms: 2000
  storage:
    provider: "local"
    local:
      root-directory: "./storage"
    tenant-quota-bytes: 10737418240
  upload:
    max-file-size: 104857600
    max-chunk-size: 10485760
    min-chunk-size: 1048576
    max-chunks-per-upload: 100
    max-concurrent-uploads-per-user: 5
    max-concurrent-uploads-per-tenant: 20
  ai:
    model-name: "gemini-2.0"
    enabled: true
    temperature: 0.7
  qdrant:
    host: "localhost"
    port: 6334
    api-key: ""
    enabled: false
    connection-timeout-ms: 2000
  ratelimit:
    limit-authentication: 10
    limit-password-reset: 5
    limit-email-verification: 5
    limit-future-ai: 20
    window-seconds: 60
  api:
    default-version: "v1"
    base-prefix: "/api"
  cors:
    allowed-origins:
      - "*"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: false
    max-age-seconds: 3600
  security:
    https-enabled: false
  logging:
    slow-request-threshold-ms: 1000
  virusscan:
    enabled: true
    provider: "CLAMAV"
    retry-count: 3
    retry-backoff-ms: 1000
    worker-threads: 5
    queue-capacity: 100
    quarantine-policy: "QUARANTINE"
    clamav:
      host: "localhost"
      port: 3310
      connection-timeout-ms: 2000
      read-timeout-ms: 5000
  metadata:
    enabled: true
    provider: "TIKA"
    retry-count: 3
    retry-backoff-ms: 1000
    tika:
      max-metadata-size: 1048576
      max-embedded-depth: 10
      max-recursion-depth: 10
      parser-timeout-ms: 10000
    worker:
      threads: 4
      queue-capacity: 100
  ocr:
    enabled: true
    provider: "TESSERACT"
    languages: "eng"
    retry-count: 3
    retry-backoff-ms: 1000
    confidence-threshold: 70.0
    tesseract:
      tessdata-path: "./tessdata"
      parser-timeout-ms: 30000
      max-pages: 100
      max-image-resolution-dpi: 300
    worker:
      threads: 2
      queue-capacity: 50
  search:
    enabled: true
    provider: "HYBRID"
    retry-count: 3
    retry-backoff-ms: 1000
    bm25-weight: 1.0
    vector-weight: 1.0
    rrf-constant: 60
    lucene:
      index-dir: "./lucene-index"
    qdrant:
      enabled: true
      host: ${QDRANT_HOST:localhost}
      port: 6334
      connection-timeout-ms: 5000
      use-tls: false
      api-key: "placeholder-key"
      collection-name: "documents"
    worker:
      threads: 4
      queue-capacity: 100
  embedding:
    enabled: true
    provider: "GEMINI"
    model-name: "text-embedding-004"
    model-version: "v1"
    retry-count: 3
    retry-backoff-ms: 1000
    gemini:
      project-id: "placeholder-gcp-project"
      location: "us-central1"
      connection-timeout-ms: 5000
      max-chunks-per-batch: 30
    chunking:
      strategy: "HYBRID"
      max-characters: 1000
      overlap-characters: 150
    worker:
      threads: 4
      queue-capacity: 100
  semanticsearch:
    enabled: true
    mode: "HYBRID"
    provider: "QDRANT"
    similarity-metric: "COSINE"
    default-limit: 10
    log-raw-queries: false
    cache-ttl-ms: 60000
    queryembedding:
      model-name: "text-embedding-004"
      model-version: "v1"
      dimensions: 768
    worker:
      threads: 4
      queue-capacity: 100
  rag:
    enabled: true
    default-model-name: "gemini-2.5-flash"
    default-max-context-tokens: 2000
    default-temperature: 0.2
    enforce-hallucination-safeguards: true
    system-prompt-template: |
      You are a secure, enterprise AI assistant. Use the following context to answer the user's query.
      If you do not know the answer based on the context, say that you cannot find the answer.
      Do not make up facts or generate information outside the provided context (no hallucinations).
      
      Context:
      ---
      [CONTEXT_CONTENT]
      ---
    worker:
      threads: 4
      queue-capacity: 100
