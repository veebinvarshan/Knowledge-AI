spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowledge_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}

logging:
  level:
    root: INFO
    com.enterprise.platform: DEBUG
    org.springframework.security: DEBUG
