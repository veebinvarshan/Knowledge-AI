name: Knowledge AI - CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Compile, Test & Package)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: knowledge_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw
        working-directory: backend

      - name: Compile Backend
        run: ./mvnw clean compile -B
        working-directory: backend

      - name: Run Backend Tests
        run: ./mvnw test -B
        working-directory: backend
        env:
          GEMINI_API_KEY: mock-ci-gemini-api-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: knowledge_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Package Spring Boot Executable JAR
        run: ./mvnw package -DskipTests -B
        working-directory: backend

      - name: Upload Spring Boot Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-executable-jar
          path: backend/target/platform-1.0.0.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend-ci:
    name: Frontend CI (Lint, Build & Package)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Frontend Linter
        run: npm run lint
        working-directory: frontend

      - name: Build Next.js Production Frontend
        run: npm run build
        working-directory: frontend

      - name: Upload Next.js Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone-build
          path: frontend/.next/standalone/
          retention-days: 7
          if-no-files-found: error

  docker-ci:
    name: Docker Build Verification (Backend, Frontend & Nginx)
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: knowledge-backend:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: knowledge-frontend:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Nginx Reverse Proxy Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          tags: knowledge-nginx:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Explicit Docker Image Inspection Verification
        run: |
          docker image inspect knowledge-backend:ci
          docker image inspect knowledge-frontend:ci
          docker image inspect knowledge-nginx:ci
